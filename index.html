<!DOCTYPE html>
<html lang="es" class="h-full bg-[#ffffff] text-[#212121]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-pin.png" />
    <link rel="shortcut icon" href="/logo-pin.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Expansión Franquicias — Negozona</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      @keyframes appPulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
      .app-skel { background-color: #f1f1f4; animation: appPulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; border-radius: 3px; }
    </style>
  </head>
  <body class="h-full antialiased selection:bg-[#ff7759] selection:text-[#ffffff]">
    <div id="app" class="h-full flex overflow-hidden bg-white relative">
      <!-- Initial Shell Skeleton -->
      <aside class="hidden lg:flex w-60 border-r border-[#d9d9dd] bg-white flex-col h-full shrink-0 p-4 gap-6 select-none">
        <div class="flex items-center gap-3 px-2 py-2">
          <div class="h-7 w-7 rounded-sm app-skel"></div>
          <div class="h-4 w-28 app-skel"></div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="h-8 w-full rounded-xs app-skel"></div>
          <div class="h-8 w-full rounded-xs app-skel"></div>
          <div class="h-8 w-full rounded-xs app-skel"></div>
          <div class="h-8 w-full rounded-xs app-skel"></div>
          <div class="h-8 w-full rounded-xs app-skel"></div>
        </div>
      </aside>
      <div class="flex-1 flex flex-col min-w-0 h-full">
        <nav class="h-16 bg-white border-b border-[#d9d9dd] px-8 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-3">
            <div class="h-5 w-5 rounded-xs app-skel"></div>
            <div class="h-3.5 w-36 app-skel"></div>
          </div>
          <div class="flex items-center gap-3">
            <div class="h-7 w-20 rounded-full app-skel"></div>
            <div class="h-7 w-7 rounded-full app-skel"></div>
          </div>
        </nav>
        <main class="flex-1 overflow-y-auto bg-white p-8 relative">
          <div class="flex flex-col gap-8 w-full pb-12">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-[#d9d9dd] pb-6">
              <div class="flex flex-col gap-2">
                <div class="h-7 w-52 app-skel"></div>
                <div class="h-3.5 w-72 app-skel"></div>
              </div>
              <div class="flex gap-2">
                <div class="h-8 w-20 rounded-full app-skel"></div>
                <div class="h-8 w-24 rounded-full app-skel"></div>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              <div class="border border-[#e5e7eb] rounded-xs p-6 h-28 flex flex-col justify-between"><div class="h-3 w-20 app-skel"></div><div class="h-8 w-16 app-skel"></div></div>
              <div class="border border-[#e5e7eb] rounded-xs p-6 h-28 flex flex-col justify-between"><div class="h-3 w-20 app-skel"></div><div class="h-8 w-16 app-skel"></div></div>
              <div class="border border-[#e5e7eb] rounded-xs p-6 h-28 flex flex-col justify-between"><div class="h-3 w-20 app-skel"></div><div class="h-8 w-16 app-skel"></div></div>
              <div class="border border-[#e5e7eb] rounded-xs p-6 h-28 flex flex-col justify-between"><div class="h-3 w-20 app-skel"></div><div class="h-8 w-16 app-skel"></div></div>
            </div>
            <div class="border border-[#d9d9dd] rounded-xs overflow-hidden">
              <div class="px-6 py-3 border-b border-[#d9d9dd] bg-neutral-50 flex gap-6"><div class="h-3 w-24 app-skel"></div><div class="h-3 w-32 app-skel"></div><div class="h-3 w-20 app-skel"></div></div>
              <div class="px-6 py-4 border-b border-[#e5e7eb] flex items-center gap-6"><div class="h-3.5 w-36 app-skel"></div><div class="h-3.5 w-28 app-skel"></div><div class="h-3.5 w-20 app-skel"></div></div>
              <div class="px-6 py-4 border-b border-[#e5e7eb] flex items-center gap-6"><div class="h-3.5 w-32 app-skel"></div><div class="h-3.5 w-24 app-skel"></div><div class="h-3.5 w-16 app-skel"></div></div>
              <div class="px-6 py-4 border-b border-[#e5e7eb] flex items-center gap-6"><div class="h-3.5 w-40 app-skel"></div><div class="h-3.5 w-28 app-skel"></div><div class="h-3.5 w-24 app-skel"></div></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
